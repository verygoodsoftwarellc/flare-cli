name: Release

# Attaches prebuilt binaries to each published GitHub release, so installing
# doesn't require a Go toolchain.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      # Asset names leave out the version so releases/latest/download/ URLs
      # stay stable. go build stamps the tag into --version, unless the checkout
      # looks modified, so dist lives outside it.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            name="flare-cli_${GOOS}_${GOARCH}"
            binary=flare-cli
            [ "$GOOS" = windows ] && binary=flare-cli.exe
            mkdir "$dist/$name"
            go build -trimpath -ldflags "-s -w" -o "$dist/$name/$binary" .
            cp README.md "$dist/$name/"
            tar -C "$dist/$name" -czf "$dist/$name.tar.gz" "$binary" README.md
            rm -r "$dist/$name"
          done
          (cd "$dist" && sha256sum -- * > checksums.txt)

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber --repo "$GITHUB_REPOSITORY"
